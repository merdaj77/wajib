<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>واجب</title>
<style>
  :root {
    --bg: #F3F6FB; --card: #fff; --ink: #16213A; --mute: #7A8499;
    --line: #E6EBF3; --sky: #2E9BF0; --sky-soft: #E3F1FD;
    --turq-soft: #DDF5F2; --turq-ink: #0F8A7C; --red: #EF4F5F; --red-soft: #FDE7EA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 130px; }
  .cap { color: var(--mute); font-size: 14px; }
  h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.3; }
  .card {
    background: var(--card); border-radius: 24px; padding: 18px;
    margin-top: 14px; box-shadow: 0 8px 24px rgba(22, 33, 58, .06);
  }
  .q-num { color: var(--sky); font-weight: 700; font-size: 14px; }
  .q-text { font-weight: 600; margin: 2px 0 10px; white-space: pre-wrap; }
  .ayah { font-size: 21px; line-height: 2.1; margin-bottom: 6px; }
  label.opt {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; margin-top: 8px; border-radius: 16px;
    background: var(--bg); border: 2px solid transparent; cursor: pointer;
  }
  label.opt input { accent-color: var(--sky); width: 20px; height: 20px; margin: 0; flex: none; }
  label.opt.on { border-color: var(--sky); background: var(--sky-soft); }
  .tf { display: flex; gap: 10px; }
  .tf label.opt { flex: 1; justify-content: center; }
  select, textarea {
    width: 100%; font: inherit; color: inherit; border: 2px solid var(--line);
    border-radius: 16px; padding: 12px 14px; background: var(--bg);
  }
  textarea { min-height: 110px; resize: vertical; }
  select:focus, textarea:focus { outline: none; border-color: var(--sky); }
  .bar {
    position: fixed; inset: auto 0 0 0;
    padding: 18px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(243, 246, 251, 0), var(--bg) 35%);
  }
  .bar button {
    display: block; width: 100%; max-width: 560px; margin: 0 auto;
    border: 0; border-radius: 20px; padding: 16px; font: inherit; font-weight: 700;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  .bar button:disabled { opacity: .35; cursor: default; }
  .hint { color: var(--mute); font-size: 14px; text-align: center; margin-top: 6px; }
  .note { border-radius: 18px; padding: 14px 16px; margin-top: 14px; font-weight: 600; }
  .note.red { background: var(--red-soft); color: var(--red); }
  .note.ok { background: var(--turq-soft); color: var(--turq-ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <noscript>
    <div class="note red">افتح هذا الرابط في Safari أو Chrome.</div>
  </noscript>
  <div id="bad" class="note red" hidden>
    الرابط ناقص أو تالف. اطلب من المعلم إرساله مرة أخرى.
  </div>
  <div id="form" hidden>
    <div class="cap" id="org"></div>
    <h1 id="title"></h1>
    <div class="cap" id="meta"></div>
    <div id="sent" class="note ok" hidden>
      فُتح واتساب برسالة إجاباتك. تأكد أنك ضغطت إرسال هناك.
    </div>
    <div class="card">
      <div class="q-text">اختر اسمك</div>
      <select id="student"><option value="">— اختر —</option></select>
    </div>
    <div id="questions"></div>
  </div>
</main>

<div class="bar" id="bar" hidden>
  <button id="send" disabled>إرسال للمعلم عبر واتساب</button>
  <div class="hint" id="hint"></div>
</div>

<script>
/*
  The homework travels inside the link, after "#", so it never reaches the
  server that hosts this page. Link: #j.<base64url JSON> or #z.<base64url
  of raw-deflated JSON>. JSON:
    { v: 1, id, t: title, o: org line, p: teacher phone (digits),
      n: [student names],
      q: [ { k: "m" | "t" | "e", s: question, a?: ayah text, c?: [choices] } ] }
  The right answers are never in the link; the teacher's app grades.
  Answers go back as a WhatsApp message ending with a code the app reads:
    QE1.<base64url JSON { h: id, s: student index, n: name, a: [answers] }>
*/
const $ = (id) => document.getElementById(id);

function b64urlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64url(bytes) {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function readHomework() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const dot = hash.indexOf('.');
  const kind = hash.slice(0, dot);
  let bytes = b64urlToBytes(hash.slice(dot + 1));
  if (kind === 'z') {
    const stream = new Blob([bytes]).stream()
      .pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  } else if (kind !== 'j') {
    throw new Error('unknown link');
  }
  const hw = JSON.parse(new TextDecoder().decode(bytes));
  if (!hw.id || !Array.isArray(hw.q) || !Array.isArray(hw.n)) {
    throw new Error('bad homework');
  }
  return hw;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function choice(name, value, label, onPick) {
  const l = el('label', 'opt');
  const i = document.createElement('input');
  i.type = 'radio';
  i.name = name;
  i.value = value;
  i.addEventListener('change', onPick);
  l.append(i, document.createTextNode(label));
  return l;
}

function render(hw) {
  document.title = 'واجب: ' + hw.t;
  $('org').textContent = hw.o || '';
  $('title').textContent = hw.t;
  $('meta').textContent = hw.q.length + ' ' + (hw.q.length <= 10 ? 'أسئلة' : 'سؤالاً');

  const sel = $('student');
  hw.n.forEach((name, i) => sel.append(new Option(name, String(i))));

  const box = $('questions');
  const letters = 'أبجدهوزح';
  hw.q.forEach((q, i) => {
    const card = el('div', 'card');
    card.dataset.k = q.k;
    card.append(el('div', 'q-num', 'السؤال ' + (i + 1)), el('div', 'q-text', q.s));
    if (q.a) card.append(el('div', 'ayah', '﴿' + q.a + '﴾'));
    const name = 'q' + i;
    const mark = () => card.querySelectorAll('label.opt').forEach(
      (l) => l.classList.toggle('on', l.querySelector('input').checked));
    if (q.k === 'm') {
      (q.c || []).forEach((c, j) => card.append(choice(name, letters[j], c, mark)));
    } else if (q.k === 't') {
      const row = el('div', 'tf');
      row.append(choice(name, 'صح', 'صح', mark), choice(name, 'خطأ', 'خطأ', mark));
      card.append(row);
    } else {
      const t = document.createElement('textarea');
      t.name = name;
      t.placeholder = 'اكتب إجابتك هنا';
      card.append(t);
    }
    box.append(card);
  });
}

function answers() {
  return [...document.querySelectorAll('#questions .card')].map((card) => {
    if (card.dataset.k === 'e') return card.querySelector('textarea').value.trim();
    const c = card.querySelector('input:checked');
    return c ? c.value : '';
  });
}

function update() {
  const left = answers().filter((x) => !x).length;
  const named = $('student').value !== '';
  $('send').disabled = !named || left > 0;
  $('hint').textContent = !named
    ? 'اختر اسمك أولاً'
    : left === 0 ? 'جاهز للإرسال'
    : left === 1 ? 'بقي سؤال واحد' : left === 2 ? 'بقي سؤالان'
    : 'بقي ' + left + ' أسئلة';
}

function send(hw) {
  const s = +$('student').value;
  const a = answers();
  const code = 'QE1.' + bytesToB64url(new TextEncoder().encode(
    JSON.stringify({ h: hw.id, s, n: hw.n[s], a })));
  const text = [
    'واجب: ' + hw.t,
    'الطالب: ' + hw.n[s],
    '',
    ...a.map((x, i) => (i + 1) + ') ' + x),
    '',
    code,
  ].join('\n');
  $('sent').hidden = false;
  location.href = 'https://wa.me/' + (hw.p || '') + '?text=' + encodeURIComponent(text);
}

readHomework().then((hw) => {
  render(hw);
  $('form').hidden = false;
  $('bar').hidden = false;
  document.addEventListener('input', update);
  document.addEventListener('change', update);
  $('send').addEventListener('click', () => send(hw));
  update();
}).catch(() => { $('bad').hidden = false; });
</script>
</body>
</html>
